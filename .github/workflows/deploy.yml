name: Build and deploy to GitHub Pages

# Runs on the repository's default branch. If the default branch is renamed
# (e.g. to main), add it here so deploys keep firing.
on:
  push:
    branches:
      - main
      - claude/era-project-02-init-zfcj9f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Must run before the build: it reports the URL Pages will serve from,
      # which the generator needs for canonical, hreflang, OG and sitemap.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: node build.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Check the build produced every page
        run: |
          test -f dist/index.html
          test -f dist/bn/index.html
          test "$(find dist -name '*.html' | wc -l)" -eq 8

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
